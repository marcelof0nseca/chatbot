spring.application.name=chatbot

# ---------------------------------------------------------------
# Servidor
# ---------------------------------------------------------------
server.port=8080

# ---------------------------------------------------------------
# Fuso horario fixo. O servidor em nuvem roda em UTC; sem isto o
# "dia" do resumo da fila viraria as 21h do horario de Recife.
#
# Banco num servidor em UTC: o deslocamento de 3 horas tinha DUAS
# causas, e cada uma tem a sua correcao. As duas sao necessarias:
#
# 1. O H2 calcula o CURRENT_TIMESTAMP do data.sql no fuso da sessao,
#    que por padrao e o da JVM (UTC). A carga de exemplo nascia 3h
#    adiantada em relacao ao horario de Recife usado pela aplicacao.
#    Correcao: TIME ZONE=America/Recife na URL do H2 (abaixo).
#
# 2. Com a sessao do banco em Recife e a JVM em UTC, o driver JDBC
#    convertia os horarios pelo fuso da JVM ao ler e gravar, e os
#    deslocava 3h de novo. Correcao: java_time_use_direct_jdbc, mais
#    abaixo, que passa as datas ao banco sem conversao.
#
# Verificado com a JVM em UTC: so a combinacao das duas passa no
# FilaPersistenciaTest; qualquer uma sozinha deixa a espera da fila
# negativa. Os testes rodam sempre em UTC (surefire, no pom.xml).
# ---------------------------------------------------------------
app.zona=America/Recife

# ---------------------------------------------------------------
# Banco de dados H2 (em ARQUIVO local, nao em memoria)
# O arquivo fica em ./data/chatbotdb.mv.db na raiz do projeto.
# TIME ZONE: correcao 1 do bloco de fuso, acima.
# ---------------------------------------------------------------
spring.datasource.url=jdbc:h2:file:./data/chatbotdb;TIME ZONE=America/Recife
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ---------------------------------------------------------------
# Console web do H2: http://localhost:8080/h2-console
# JDBC URL para colar na tela de login: jdbc:h2:file:./data/chatbotdb
# ---------------------------------------------------------------
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---------------------------------------------------------------
# JPA / Hibernate
# ---------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.jpa.defer-datasource-initialization=true
# API REST: nao manter a sessao JPA aberta durante a renderizacao da resposta
spring.jpa.open-in-view=false
# Datas vao ao banco como LocalDateTime, sem converter pelo fuso da JVM:
# correcao 2 do bloco de fuso, no inicio do arquivo.
spring.jpa.properties.hibernate.type.java_time_use_direct_jdbc=true

# ---------------------------------------------------------------
# CORS - origens do frontend (projeto separado).
# Varias origens separadas por virgula.
# ---------------------------------------------------------------
app.cors.allowed-origins=http://localhost:5500,http://127.0.0.1:5500
